<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Frontier V14.1 SHADOW</title><style>body{font:16px system-ui;background:#101a2a;color:white;max-width:680px;margin:auto;padding:20px}button,input,textarea{font:inherit;padding:12px;margin:10px 0}button{background:#34658e;color:white;border:0;border-radius:8px}button:disabled{opacity:.5}textarea{width:95%}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#1b3045;padding:12px}</style></head><body><h2>Frontier V14.1 SHADOW</h2><p>Afzonderlijke test. De werkende V14 blijft ongewijzigd. GGUF blijft op je telefoon.</p><pre id="env">Controleren...</pre><button id="check">Controleer offline-bestanden</button><pre id="cache">Nog niet gecontroleerd</pre><input id="file" type="file" accept=".gguf"><button id="load">Laad lokaal model</button><pre id="status">Nog niet geladen</pre><textarea id="prompt" rows="3">What is 17 + 25? Reply with just the number.</textarea><button id="run" disabled>Genereer antwoord</button><pre id="result"></pre><script type="module">
const $=id=>document.getElementById(id),required=['../index.html','../esm/index.js','../esm/wasm/wllama.wasm','../manifest.webmanifest','./index.html','./sw.js'];let ai;
$('env').textContent='HTTPS: '+(location.protocol==='https:')+' | WASM: '+!!window.WebAssembly+' | Isolated: '+crossOriginIsolated;
async function inspect(){try{const cache=await caches.open('frontier-v141-shadow-1');const missing=[];for(const p of required){const url=new URL(p,location.href).href;if(!(await cache.match(url)))missing.push(p)}const persisted=await navigator.storage?.persisted?.();$('cache').textContent=missing.length?'NIET COMPLEET: '+missing.join(', '):'PASS: alle 6 bestanden in SHADOW-cache';$('cache').textContent+=' | Persistent storage: '+(persisted?'ja':'niet bevestigd')}catch(e){$('cache').textContent='FAIL: '+e.message}}
$('check').onclick=inspect;
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('./sw.js',{scope:'./'}).then(async r=>{await navigator.serviceWorker.ready;await inspect()}).catch(e=>$('cache').textContent='SW FAIL: '+e.message)}
$('load').onclick=async()=>{try{const f=$('file').files[0];if(!f)throw Error('Selecteer GGUF');$('load').disabled=true;$('status').textContent='Model laden...';const {Wllama}=await import('../esm/index.js');ai=new Wllama({default:new URL('../esm/wasm/wllama.wasm',location.href).href});await ai.loadModel([f],{n_threads:1,n_gpu_layers:0,n_ctx:512});$('status').textContent='PASS: model geladen';$('run').disabled=false}catch(e){$('status').textContent='FAIL: '+(e.stack||e);$('load').disabled=false}};
$('run').onclick=async()=>{try{$('run').disabled=true;$('result').textContent='Genereren...';const r=await ai.createChatCompletion({messages:[{role:'user',content:$('prompt').value}],max_tokens:32,temperature:0});$('result').textContent=String(r.choices?.[0]?.message?.content??JSON.stringify(r));$('status').textContent='PASS: inferentie uitgevoerd'}catch(e){$('result').textContent='FAIL: '+(e.stack||e)}finally{$('run').disabled=false}};
</script></body></html>
