<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101a2a"><link rel="manifest" href="./manifest.webmanifest"><title>Frontier AI Portable V14</title>
<style>body{background:#101a2a;color:#f2f6ff;font:16px system-ui;max-width:720px;margin:20px auto;padding:16px}button,input,textarea{font:inherit;padding:12px;margin:8px 0;box-sizing:border-box}input[type=file],textarea{width:100%}button{background:#35628c;color:white;border:0;border-radius:8px}button:disabled{opacity:.45}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#1b2d42;padding:12px;border-radius:8px}</style></head>
<body><h2>Frontier V14 - lokale AI</h2><p>De AI draait lokaal op je telefoon. Kies je eigen GGUF-bestand; het wordt niet naar GitHub verzonden. Voor offline gebruik moeten de appbestanden eerst via HTTPS zijn geladen en gecachet.</p><pre id="environment">Browser controleren...</pre><label>Qwen GGUF: <input id="model" type="file" accept=".gguf"></label><button id="load">Laad lokaal model</button><pre id="log">Nog niet geladen.</pre><textarea id="question" rows="3">What is 17 + 25? Reply with just the number.</textarea><button id="run" disabled>Genereer echt antwoord</button><pre id="answer"></pre>
<script type="module">
const log=document.getElementById('log'),load=document.getElementById('load'),run=document.getElementById('run');
const say=t=>log.textContent=t;
document.getElementById('environment').textContent='Protocol: '+location.protocol+' | WASM: '+!!window.WebAssembly+' | Isolated: '+crossOriginIsolated;
window.addEventListener('error',e=>say('JS FOUT: '+e.message));window.addEventListener('unhandledrejection',e=>say('ASYNC FOUT: '+(e.reason?.stack||e.reason)));
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').then(()=>{document.getElementById('environment').textContent+=' | Offline-cache aangevraagd'}).catch(e=>say('Cache waarschuwing: '+e.message));
let ai;
load.onclick=async()=>{try{if(location.protocol!=='https:'&&location.hostname!=='localhost')throw Error('HTTPS vereist');const f=document.getElementById('model').files[0];if(!f)throw Error('Kies eerst GGUF');load.disabled=true;run.disabled=true;say('Engine laden. GGUF '+(f.size/1048576).toFixed(1)+' MiB...');const {Wllama}=await import('./esm/index.js');ai=new Wllama({default:new URL('./esm/wasm/wllama.wasm',location.href).href});await ai.loadModel([f],{n_threads:1,n_gpu_layers:0,n_ctx:512});say('PASS: model geladen');run.disabled=false}catch(e){say('FAIL: '+(e?.stack||e));load.disabled=false}};
run.onclick=async()=>{try{run.disabled=true;document.getElementById('answer').textContent='Genereren...';const res=await ai.createChatCompletion({messages:[{role:'user',content:document.getElementById('question').value}],max_tokens:32,temperature:0});document.getElementById('answer').textContent=String(res.choices?.[0]?.message?.content??JSON.stringify(res));say('PASS: inferentie uitgevoerd')}catch(e){document.getElementById('answer').textContent='FAIL: '+(e?.stack||e)}finally{run.disabled=false}};
</script></body></html>
