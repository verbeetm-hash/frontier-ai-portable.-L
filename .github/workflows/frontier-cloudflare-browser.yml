name: Frontier SHADOW browser assurance
on:
  workflow_dispatch:
  push:
    branches:
      - shadow/frontier-v18-release-gate-20261015
    paths:
      - 'tests/frontier-cloudflare.spec.mjs'
      - 'playwright.config.mjs'
      - '.github/workflows/frontier-cloudflare-browser.yml'
  schedule:
    - cron: '23 6 * * *'
permissions:
  contents: read
jobs:
  cloudflare-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save @playwright/test@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config=playwright.config.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontier-browser-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
