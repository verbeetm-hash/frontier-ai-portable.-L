<!doctype html><html lang="nl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Frontier V14.6 Assurance Self-Test</title><style>body{background:#101a2a;color:#fff;font:16px system-ui;max-width:760px;margin:2rem auto;padding:1rem}pre{white-space:pre-wrap;background:#202c40;padding:1rem}button{padding:12px}</style><h1>Frontier Assurance Self-Test</h1><p>Read-only. No GGUF download, no personal data, no account access. Tests actual protocol integrity in this browser.</p><button id="run">Start test</button><pre id="output">Not run</pre><script type="module">import {requireMaximumAssurance,ASSURANCE_SHA256} from './maximum-assurance-gate.js';const out=document.querySelector('#output');document.querySelector('#run').onclick=async()=>{const rows=[];const check=(label,ok)=>rows.push((ok?'PASS':'FAIL')+' - '+label);try{const result=await requireMaximumAssurance();check('protocol integrity',result.status==='PASS'&&result.sha256===ASSURANCE_SHA256);check('protocol scope',result.text.includes('Frontier Portable application only'));check('fail-closed contract',result.text.includes('UNKNOWN is not PASS'));const sw=await fetch('./sw.js',{cache:'no-store'});const swText=await sw.text();check('service worker reachable',sw.ok);check('offline asset inventory',swText.includes('maximum-assurance-gate.js')&&swText.includes('maximum-assurance-protocol.txt'));const app=await fetch('./index.html',{cache:'no-store'});const html=await app.text();check('app reachable',app.ok);check('startup verification',html.includes('requireMaximumAssurance()'));check('system prompt injection',html.includes('freshAssurance.text'));check('model load recheck',html.includes('await assuranceReady;await requireMaximumAssurance()'));check('inference recheck',html.includes('const freshAssurance=await requireMaximumAssurance()'));}catch(e){rows.push('HOLD - '+String(e.message||e))}out.textContent=rows.join('\n')+'\n'+(rows.length===10&&rows.every(x=>x.startsWith('PASS'))?'RESULT: STATIC/BROWSER INTEGRITY PASS (GGUF inference NOT TESTED)':'RESULT: HOLD');};</script></html>
