<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Frontier V14.5 Canary</title><style>body{font:16px system-ui;background:#101a2a;color:#fff;max-width:700px;margin:auto;padding:20px}button,input,textarea{font:inherit;padding:12px;margin:6px 0}button{background:#34658e;color:white;border:0;border-radius:8px}button:disabled{opacity:.5}textarea{width:95%}pre{background:#1b3045;padding:12px;white-space:pre-wrap;overflow-wrap:anywhere}</style></head><body><h2>Frontier V14.5 CANARY</h2><p>Afzonderlijke testversie. V14 blijft intact. Model blijft lokaal.</p><pre id="state">Initialiseren...</pre><button id="check">Controleer cache en SW</button><button id="storage">Vraag duurzame opslag</button><pre id="audit"></pre><button id="repair">Herstel offline-cache (alleen online)</button><pre id="repairlog">Nog niet gestart</pre><p><input id="file" type="file" accept=".gguf"></p><button id="load">Laad lokaal model</button><pre id="log">Nog niet geladen</pre><textarea id="prompt" rows="3">What is 17 + 25? Reply with just the number.</textarea><p><button id="run" disabled>Genereer echt antwoord</button></p><pre id="answer"></pre><script type="module">
const $=id=>document.getElementById(id),ROOT=new URL('../',location.href),FILES=['v14-5/index.html','v14-5/sw.js','esm/index.js','esm/wasm/wllama.wasm','manifest.webmanifest'];let ai;
$('state').textContent='HTTPS: '+(location.protocol==='https:')+' | WASM: '+!!window.WebAssembly;
async function check(){const lines=[];try{const reg=await navigator.serviceWorker.getRegistration('./');lines.push('SW actief: '+!!reg?.active);lines.push('Pagina gecontroleerd: '+!!navigator.serviceWorker.controller);const cache=await caches.open('frontier-v145-20261011');for(const p of FILES){const r=await cache.match(new URL(p,ROOT).href);lines.push((r?.ok?'PASS':'FAIL')+' '+p)}lines.push('Opslag persistent: '+!!(await navigator.storage?.persisted?.()));lines.push('Browser meldt: '+(navigator.onLine?'online':'offline'))}catch(e){lines.push('FOUT: '+e.message)}$('audit').textContent=lines.join('\n')}
$('repair').onclick=async()=>{const out=$('repairlog');try{if(!navigator.onLine)throw Error('Browser meldt offline; verbind eerst met internet');out.textContent='Herstel gestart...';const urls=FILES.map(p=>new URL(p,ROOT).href);const staging=await caches.open('frontier-v145-staging');await staging.addAll(urls);for(const u of urls){const r=await staging.match(u);if(!r?.ok)throw Error('Herstelcontrole mislukt: '+u)}const dest=await caches.open('frontier-v145-20261011');for(const u of urls){const r=await staging.match(u);await dest.put(u,r)}out.textContent='PASS: vijf bestanden opnieuw gecachet; test offline herstart nog apart';await check()}catch(e){out.textContent='FAIL: '+e.message}};$('check').onclick=check;$('storage').onclick=async()=>{try{const ok=await navigator.storage.persist();await check();$('audit').textContent+='\nPersistent aanvraag: '+(ok?'TOEGEKEND':'NIET TOEGEKEND')}catch(e){$('audit').textContent='FOUT: '+e.message}};
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('./sw.js',{scope:'./'}).then(async()=>{await navigator.serviceWorker.ready;await check()}).catch(e=>$('audit').textContent='SW FAIL: '+e.message)}
$('load').onclick=async()=>{try{const f=$('file').files[0];if(!f)throw Error('Kies GGUF');$('load').disabled=true;$('run').disabled=true;ai=undefined;$('log').textContent='Laden...';const {Wllama}=await import('../esm/index.js');ai=new Wllama({default:new URL('../esm/wasm/wllama.wasm',location.href).href});await ai.loadModel([f],{n_threads:1,n_gpu_layers:0,n_ctx:512});$('log').textContent='PASS: model geladen';$('run').disabled=false}catch(e){$('log').textContent='FAIL: '+(e.stack||e);$('load').disabled=false}};
$('run').onclick=async()=>{try{$('run').disabled=true;$('answer').textContent='Genereren...';if(!ai)throw Error('Model niet geladen');const r=await ai.createChatCompletion({messages:[{role:'user',content:$('prompt').value}],max_tokens:32,temperature:0});const answer=r.choices?.[0]?.message?.content;if(typeof answer!=='string'||!answer.trim())throw Error('Leeg of ongeldig modelantwoord');$('answer').textContent=answer;$('log').textContent='PASS: niet-leeg modelantwoord ontvangen (inhoud niet geverifieerd)'}catch(e){$('answer').textContent='FAIL: '+(e.stack||e)}finally{$('run').disabled=false}};
</script></body></html>
