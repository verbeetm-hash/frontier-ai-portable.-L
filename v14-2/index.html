<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Frontier V14.2 Offline Audit</title><style>body{background:#101a2a;color:#f3f6ff;font:16px system-ui;max-width:720px;margin:auto;padding:18px}button{background:#34658e;color:white;border:0;border-radius:8px;padding:12px;margin:6px;font:inherit}pre{background:#1b3045;padding:12px;white-space:pre-wrap;overflow-wrap:anywhere}button:disabled{opacity:.5}textarea,input{font:inherit;padding:10px;margin:8px 0}textarea{width:94%}</style></head><body><h2>Frontier V14.2 - Offline audit</h2><p>Testversie naast V14. GGUF blijft lokaal. Controleer cache, opslag en echte modelinferentie.</p><pre id="status">Initialiseren...</pre><button id="check">Controleer offline en cache</button><button id="persist">Vraag duurzame opslag aan</button><button id="report">Kopieer testrapport</button><pre id="audit">Nog geen controle</pre><p><input type="file" id="file" accept=".gguf"></p><button id="load">Laad Qwen GGUF</button><pre id="engine">Niet geladen</pre><textarea id="prompt" rows="3">What is 17 + 25? Reply with just the number.</textarea><p><button id="run" disabled>Genereer antwoord</button></p><pre id="answer"></pre><script type="module">
const $=id=>document.getElementById(id),ROOT=new URL('../',location.href),files=['v14-2/index.html','v14-2/sw.js','esm/index.js','esm/wasm/wllama.wasm','manifest.webmanifest'];let ai;
$('status').textContent='Protocol: '+location.protocol+' | WASM: '+!!WebAssembly+' | Secure: '+isSecureContext+' | SW: '+('serviceWorker' in navigator);
window.addEventListener('unhandledrejection',e=>$('engine').textContent='JS fout: '+e.reason);
async function audit(){let out=[];try{const reg=await navigator.serviceWorker.getRegistration('./');out.push('SW actief: '+!!reg?.active);const cache=await caches.open('frontier-v142-static');for(const path of files){const u=new URL(path,ROOT).href;const r=await cache.match(u);out.push((r?.ok?'PASS':'FAIL')+' '+path)}const p=await navigator.storage?.persisted?.();out.push('Duurzame opslag: '+(p?'PASS':'niet toegekend'));const e=await navigator.storage?.estimate?.();out.push('Opslag in gebruik: '+Math.round((e?.usage||0)/1048576)+' MiB');out.push('Internetstatus browser: '+(navigator.onLine?'online':'offline'))}catch(e){out.push('FOUT: '+(e.stack||e))}$('audit').textContent=out.join('\n')}
$('check').onclick=audit;
$('persist').onclick=async()=>{try{const ok=await navigator.storage.persist();$('audit').textContent='Duurzame opslag aanvraag: '+(ok?'TOEGEKEND':'NIET TOEGEKEND')+'\n';await audit()}catch(e){$('audit').textContent='FOUT: '+e.message}};
$('report').onclick=async()=>{const s=['Frontier V14.2',new Date().toISOString(),$('status').textContent,$('audit').textContent,$('engine').textContent,$('answer').textContent].join('\n');try{await navigator.clipboard.writeText(s);$('status').textContent+=' | Rapport gekopieerd'}catch(e){$('status').textContent+=' | Kopieren niet toegestaan'}};
if(location.protocol==='https:'&&'serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js',{scope:'./'}).then(async()=>{await navigator.serviceWorker.ready;await audit()}).catch(e=>$('audit').textContent='SW registratie mislukt: '+e.message)}
$('load').onclick=async()=>{try{const f=$('file').files[0];if(!f)throw Error('Selecteer eerst GGUF');$('load').disabled=true;$('engine').textContent='GGUF laden...';const {Wllama}=await import('../esm/index.js');ai=new Wllama({default:new URL('../esm/wasm/wllama.wasm',location.href).href});await ai.loadModel([f],{n_threads:1,n_gpu_layers:0,n_ctx:512});$('engine').textContent='PASS: model geladen';$('run').disabled=false}catch(e){$('engine').textContent='FAIL: '+(e.stack||e);$('load').disabled=false}};
$('run').onclick=async()=>{try{$('run').disabled=true;$('answer').textContent='Genereren...';const r=await ai.createChatCompletion({messages:[{role:'user',content:$('prompt').value}],max_tokens:32,temperature:0});$('answer').textContent=String(r.choices?.[0]?.message?.content??JSON.stringify(r));$('engine').textContent='PASS: inferentie uitgevoerd'}catch(e){$('answer').textContent='FAIL: '+(e.stack||e)}finally{$('run').disabled=false}};
</script></body></html>
